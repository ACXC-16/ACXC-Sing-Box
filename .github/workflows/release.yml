name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 安装 / 升级

            ```bash
            curl -fsSL https://acxc-16.github.io/ACXC-Sing-Box/sb.sh | sudo bash
            ```

            Debian 12 / Ubuntu 22.04+（apt + systemd）· Alpine 3.19+（apk + OpenRC），同一份脚本自动识别。
            Alpine 先执行 `apk add --no-cache bash curl`。

            已安装的用户在菜单里选 `12) 更新脚本` 即可升级。
