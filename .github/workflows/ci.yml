name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: bash -n sb.sh

      - name: shellcheck
        run: shellcheck -s bash sb.sh

      - name: 文件编码检查（LF / 无 BOM）
        run: |
          if grep -q $'\r' sb.sh; then
            echo "::error::文件里出现了 CRLF，Linux 上会跑不起来"
            exit 1
          fi
          if [ "$(head -c 3 sb.sh | xxd -p)" = "efbbbf" ]; then
            echo "::error::文件带 BOM"
            exit 1
          fi
          echo "OK"
